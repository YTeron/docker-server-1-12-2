version: '3.8'
services:
  minecraft:
    image: itzg/minecraft-server:stable-java8-jdk
    ports:
      - '25565:25565'
    volumes:
      - ./data:/data
    environment:
      - EULA=TRUE
      - TYPE=FORGE
      - VERSION=1.12.2
      - FORGE_VERSION=14.23.5.2859
    container_name: minecraft
    stdin_open: true
    tty: true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3G
        reservations:
          memory: 2G